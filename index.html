h+='<div class="mut" style="margin-top:8px">A ace · D dupla falta · W winner · E erro não forçado · F erro forçado. Verde: ponto de '+CN+'. Tempo ao lado de cada game.</div></div>'+insHtml(m,o)+'<div class="g"><button class="p" style="grid-column:1/3" onclick="img('+m.id+')">Exportar imagem (resultado, estatísticas e golpes)</button><button onclick="dl('+m.id+',0)">Baixar estatísticas (CSV)</button><button onclick="dl('+m.id+',1)">Baixar ponto a ponto (CSV)</button></div>'+nmCard(m);return h}
function spark(v){if(v.length<2)return"";var mx=Math.max.apply(0,v),mn=Math.min.apply(0,v),d=mx-mn||1,p=v.map(function(y,i){return(i*120/(v.length-1)).toFixed(1)+","+(30-26*(y-mn)/d).toFixed(1)}).join(" ");return'<svg viewBox="0 0 120 32" width="120" height="32"><polyline points="'+p+'" fill="none" stroke="var(--ac)" stroke-width="2.5"/></svg>'}
function evo(){var pl=[];M.forEach(function(m){var n=m.pn||"Carol";if(pl.indexOf(n)<0)pl.push(n)});if(!V.ev||pl.indexOf(V.ev)<0)V.ev=pl.indexOf("Carol")>=0?"Carol":pl[0];var sl=pl.length>1?sel("evn","Jogador",pl.map(function(n){return[esc(n),esc(n)]})).replace("<select",'<select onchange="V.ev=this.value;render()"').replace('value="'+esc(V.ev)+'"','value="'+esc(V.ev)+'" selected'):"";var L=M.filter(function(m){return m.pts.length>5&&(m.pn||"Carol")==V.ev}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}),h="";

h+="<h2>Todos os golpes (soma dos jogos)</h2><div class=\"card\">"+shotTable(L)+"</div><h2>Jogos</h2><div class=\"card\"><table><tr><th>Jogo</th><th>Placar</th><th>EnF</th><th>W</th><th>DF</th></tr>"+D.map(function(x){return"<tr onclick=\"go('r',"+x.m.id+')"><td>'+fd(x.m.date).slice(0,5)+" "+esc(x.m.opp)+"</td><td>"+score(x.s.R)+"</td><td>"+x.s.S[0].ue+"</td><td>"+x.s.S[0].win+"</td><td>"+x.s.S[0].df+"</td></tr>"}).join("")+"</table></div>";return h}

CN=esc(m.pn||"Carol");var g=R.cur,d=disp(g),s=R.srv,opp=esc(m.opp),n=2*(m.stw||2)-1,h='<div class="lv">';

[0,1].forEach(function(k){h+='<div class="n">'+(s==k?'<i class="sv"></i>':"")+(k?opp:CN)+(g.mode!="n"?'<span class="tag">tiebreak</span>':"")+"</div>";for(var i=0;i<n;i++){var st=R.sets[i];h+='<div class="num" style="text-align:center">'+(st?st.g[k]:i==R.sets.length?R.sg[k]:"")+"</div>"}h+='<div class="pt num">'+d[k]+"</div>"});
h+="</div></div>";
function col(k){var sv=s==k,nm=k?opp:CN;return'<div style="display:grid;gap:8px;align-content:start"><b>'+nm+(sv?" · "+(V.f1?"2º saque":"1º saque"):"")+"</b>"+(sv?'<div class="g">'+bt("ab "+(k?"l":"w"),"rec("+k+",'ace')","Ace")+bt("ab"+(V.f1?" p":""),"fault()",V.f1?"Dupla falta":"Falta")+"</div>":'<div style="min-height:64px"></div>')+bt("ab "+(k?"l":"w"),k?"rec(1,'win')":"ask(0,'win')","Winner")+'<div class="g">'+bt("ab "+(k?"w":"l"),k?"rec(0,'fe')":"ask(1,'fe')","F Erro")+bt("ab "+(k?"w":"l"),k?"rec(0,'ue')":"ask(1,'ue')","NF Erro")+"</div></div>"}

else if(V.endq)h+=endHtml(CN,opp);else h+='<div class="sheet"><div class="g g4">'+bt("","undo()","↶ Voltar")+bt("","redo()","↷ Refazer")+bt("","go('r',"+m.id+")","Estatísticas")+bt("","fin()","Encerrar")+"</div></div>";
