<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Point Placar</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14407a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--fg:#0f1b2d;--card:#fff;--mut:#5d6b80;--ac:#14407a;--ball:#dfe94a;--ln:#d9dfe9;--bad:#c23b2a;--good:#1b8a52;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--fg:#e8edf6;--card:#14213a;--mut:#97a5bd;--ac:#6fa3ec;--ln:#24334f;--bad:#f0806f;--good:#4fcf8c;--on:#0b1424}}
:root[data-theme="dark"]{--bg:#0b1424;--fg:#e8edf6;--card:#14213a;--mut:#97a5bd;--ac:#6fa3ec;--ln:#24334f;--bad:#f0806f;--good:#4fcf8c;--on:#0b1424}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.4 Barlow,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 12px 80px}
h1,h2{margin:12px 0 8px;font-size:20px}h2{font-size:16px;color:var(--mut)}
.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
button{font:700 15px Barlow,sans-serif;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:8px;padding:12px 8px;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}
.w{border-left:6px solid var(--good)}.l{border-left:6px solid var(--bad)}
.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--on)}
input,select{width:100%;font:500 16px Barlow,sans-serif;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);margin:4px 0 10px}
label{font-size:14px;color:var(--mut)}
.sb{display:grid;grid-template-columns:1fr repeat(3,36px) 64px;align-items:center;gap:4px;font-size:22px}
.sb .n{font-size:20px;font-weight:700}.sb .pt{background:var(--ac);color:var(--on);border-radius:6px;text-align:center;font-size:30px}
.sv{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ball);margin-right:6px}
.r{display:flex;justify-content:space-between;margin-top:8px}.r span{color:var(--mut);font-size:14px}.r b{font-size:18px;min-width:44px}.r b:last-child{text-align:right}
.bar{height:6px;background:var(--bad);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.d{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff}
.d.c{background:var(--good)}.d.o{background:var(--bad)}
.gm{border-bottom:1px solid var(--ln);padding:8px 0;font-size:14px}.tag{background:var(--ball);color:#222;border-radius:4px;padding:0 5px;font-size:12px;margin-left:4px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ac);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.mut{color:var(--mut);font-size:14px}.g4{grid-template-columns:repeat(4,1fr)}.g4 button{font-size:13px;padding:6px 2px}.lv{display:flex;flex-direction:column;gap:6px}.lv button{min-height:42px;padding:6px 4px;font-size:14px}.lv b{font-size:14px}.lv button.ab{min-height:64px;font-size:16px}
.mc{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:10px 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.mr{display:flex;align-items:center;gap:6px;font-size:18px;padding:3px 0}.mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ck{width:24px;color:var(--good);font-weight:700;text-align:center}.ss{display:flex;border-left:1px solid var(--ln);padding-left:4px}.sc{width:30px;text-align:center;color:var(--mut)}.sc.wn{color:var(--fg);font-weight:700}.sc sup{font-size:11px}.mf{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin-top:6px}.mf span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stp{display:flex;align-items:center;gap:10px;margin:6px 0}.stp button{width:44px;min-height:44px;padding:0}.stp b{min-width:28px;text-align:center;font-size:20px}.stp span{color:var(--mut)}.cr label{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--fg);font-size:16px}.cr input{width:auto;margin:0}.cr>b{display:block;margin-top:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{min-height:36px;padding:4px 10px}.chip.on{background:var(--ac);color:var(--on)}.er{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.er input{width:auto;margin:0}.sc2{overflow-x:auto}.sc2 th:first-child,.sc2 td:first-child{position:sticky;left:0;background:var(--card);min-width:150px}.sc2 th,.sc2 td{white-space:nowrap}.up{color:var(--good)}.dn{color:var(--bad)}.lg{background:#0e2347;border-radius:12px;padding:12px;margin-bottom:10px;text-align:center}.lg img{height:96px;width:auto}</style></head><body><div id="app"></div>
